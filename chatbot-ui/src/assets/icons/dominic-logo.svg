<svg width="200" height="200" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Định nghĩa dải màu (Gradients) -->
  <defs>
    <linearGradient id="ai-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97757" /> <!-- Claude Orange -->
      <stop offset="100%" stop-color="#6A9BCC" /> <!-- AI Blue -->
    </linearGradient>
  </defs>

  <!-- Hình nền bo tròn (Có thể xóa rect này nếu bạn muốn nền trong suốt) -->
  <rect width="100" height="100" rx="22" fill="#141413" />

  <!-- Biểu tượng chính -->
  <g transform="translate(25, 25) scale(0.5)">
    <!-- Vòng lặp vô cực/mạng lưới thần kinh -->
    <path d="M50 0C77.6142 0 100 22.3858 100 50C100 77.6142 77.6142 100 50 100C22.3858 100 0 77.6142 0 50" 
          stroke="url(#ai-gradient)" stroke-width="8" stroke-linecap="round" />
    <path d="M20 50C20 33.4315 33.4315 20 50 20C66.5685 20 80 33.4315 80 50C80 66.5685 66.5685 80 50 80" 
          stroke="white" stroke-width="6" stroke-dasharray="10 5" stroke-linecap="round" opacity="0.8" />
    <!-- Nhân AI trung tâm -->
    <circle cx="50" cy="50" r="10" fill="url(#ai-gradient)" />
  </g>
</svg>
